<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Pendente | Arte Que Veste</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/playfair-display@latest/latin-400-normal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.css">
    <style>
        body{font-family:'Inter',sans-serif;background:#faf9f6;color:#1a1a1a}
        .font-display{font-family:'Playfair Display',serif}
        .btn-primary{background:#40E0D0;color:#1a1a1a;padding:14px 32px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;border:2px solid #40E0D0;cursor:pointer;font-size:13px;transition:all .3s}
        .btn-primary:hover{background:transparent;color:#40E0D0}
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full text-center bg-white p-8 shadow-sm">
        <div class="w-20 h-20 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#eab308" stroke-width="3"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <h1 class="font-display text-3xl font-black mb-3">Pagamento Pendente</h1>
        <p class="text-gray-500 mb-2">Seu pedido foi registrado e estamos aguardando a confirmação do pagamento.</p>
        <p class="text-sm text-gray-400 mb-6" id="order-info"></p>
        <div class="bg-gray-50 p-4 rounded mb-6 text-left text-sm text-gray-600">
            <p><strong>Boleto:</strong> O pagamento leva 1-3 dias úteis para compensar.</p>
            <p><strong>Pix:</strong> Geralmente confirma em até 30 minutos.</p>
            <p class="mt-2">Você receberá um e-mail quando o pagamento for confirmado.</p>
        </div>
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="loja.html" class="btn-primary">VOLTAR À LOJA</a>
            <a href="https://wa.me/5579999999999?text=Olá! Tenho dúvida sobre meu pedido pendente" target="_blank" class="btn-primary" style="background:transparent;color:#1a1a1a;border-color:#ddd">WHATSAPP</a>
        </div>
    </div>
    <script>
    const params = new URLSearchParams(location.search);
    const orderId = params.get('id');
    if (orderId) document.getElementById('order-info').textContent = `Pedido #${orderId}`;
    </script>

<!-- FRONT-UPGRADE: Lenis + GSAP -->
<script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
<script>
(function(){try{
if(window.Lenis){var l=new Lenis({duration:1.1});var r=function(t){l.raf(t);requestAnimationFrame(r)};requestAnimationFrame(r);}
if(window.gsap&&window.ScrollTrigger){gsap.registerPlugin(ScrollTrigger);
document.querySelectorAll('section,h1,h2,.card,img').forEach(function(el){
gsap.from(el,{opacity:0,y:26,duration:0.8,ease:'power2.out',scrollTrigger:{trigger:el,start:'top 90%'}});
});
}}catch(e){}})();
</script>
</body>
</html>
