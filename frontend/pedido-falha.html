<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Não Aprovado | Arte Que Veste</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/playfair-display@latest/latin-400-normal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.css">
    <style>
        body{font-family:'Inter',sans-serif;background:#faf9f6;color:#1a1a1a}
        .font-display{font-family:'Playfair Display',serif}
        .btn-primary{background:#40E0D0;color:#1a1a1a;padding:14px 32px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;border:2px solid #40E0D0;cursor:pointer;font-size:13px;transition:all .3s}
        .btn-primary:hover{background:transparent;color:#40E0D0}
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full text-center bg-white p-8 shadow-sm">
        <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
        <h1 class="font-display text-3xl font-black mb-3">Pagamento Não Aprovado</h1>
        <p class="text-gray-500 mb-6">Não se preocupe! Você pode tentar novamente ou escolher outra forma de pagamento.</p>
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="carrinho.html" class="btn-primary">TENTAR NOVAMENTE</a>
            <a href="loja.html" class="btn-primary" style="background:transparent;color:#1a1a1a;border-color:#ddd">VOLTAR À LOJA</a>
        </div>
        <p class="text-xs text-gray-400 mt-6">Se o problema persistir, fale conosco no <a href="https://wa.me/5579999999999" class="underline text-[#40E0D0]">WhatsApp</a>.</p>
    </div>

<!-- FRONT-UPGRADE: Lenis + GSAP -->
<script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
<script>
(function(){try{
if(window.Lenis){var l=new Lenis({duration:1.1});var r=function(t){l.raf(t);requestAnimationFrame(r)};requestAnimationFrame(r);}
if(window.gsap&&window.ScrollTrigger){gsap.registerPlugin(ScrollTrigger);
document.querySelectorAll('section,h1,h2,.card,img').forEach(function(el){
gsap.from(el,{opacity:0,y:26,duration:0.8,ease:'power2.out',scrollTrigger:{trigger:el,start:'top 90%'}});
});
}}catch(e){}})();
</script>
</body>
</html>
