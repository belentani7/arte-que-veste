name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check frontend Node server
        working-directory: frontend
        run: npm run check
      - name: Test storefront HTTP security
        working-directory: frontend
        run: npm test
      - name: Test safe Nuvemshop importer
        run: python -m unittest discover -s transferencia-nuvemshop -p 'test_*.py' -v
