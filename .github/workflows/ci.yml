name: Arte Que Veste / commerce security and server contracts
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storefront:
    name: Syntax, cart/checkout and HTTP server regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real product JavaScript syntax
        run: npm run check
      - name: Execute both security regressions without external dependencies
        run: npm test
